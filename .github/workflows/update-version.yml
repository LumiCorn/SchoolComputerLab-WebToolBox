name: 构建并部署 Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update date in version.json for deployment artifact
      run: |
        jq -e '.version | type == "string" and length > 0' version.json > /dev/null
        mkdir -p _site
        rsync -av --exclude '.git' --exclude '.github' ./ _site/
        CURRENT_DATE=$(date -u +%Y-%m-%d)
        jq --arg date "$CURRENT_DATE" '.lastUpdated = $date' _site/version.json > _site/version_temp.json
        mv _site/version_temp.json _site/version.json

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4